apiVersion: v1
kind: Namespace
metadata:
  name: staging
  labels:
    # Pod Security Admission: reject any pod that doesn't meet the RESTRICTED
    # profile (non-root, seccomp, no privilege escalation, dropped capabilities).
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
